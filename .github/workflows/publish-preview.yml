name: Publish YAAD preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: yaad-preview-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble and verify the public preview
        run: python3 preview/fetch.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache'}
          for attempt in range(20):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                  data = json.load(response)
              if any(item['name'] == 'github-pages' and not item['expired'] for item in data['artifacts']):
                  print('Pages artifact is available for deployment.')
                  break
              time.sleep(3)
          else:
              raise RuntimeError('Pages artifact did not become available.')
          PYTHON
      - name: Deploy verified artifact through Pages API
        id: deployment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const listed = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId});
            const artifacts = listed.data.artifacts.filter(a => a.name === 'github-pages' && !a.expired);
            if (artifacts.length !== 1) throw new Error('Expected one verified Pages artifact.');
            const oidc = await core.getIDToken();
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifacts[0].id,
              pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', created.data.page_url);
            const deploymentId = created.data.id || created.data.status_url.split('/').pop();
            const failures = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 84; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const current = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {owner, repo, deploymentId});
              if (current.data.status === 'succeed') {
                core.info('Public preview deployed successfully.');
                return;
              }
              if (failures.has(current.data.status)) throw new Error('Pages status: ' + current.data.status);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {owner, repo, deploymentId});
            throw new Error('Pages deployment timed out.');
